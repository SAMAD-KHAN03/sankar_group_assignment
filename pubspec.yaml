name: task_manager
description: A Flutter Task Manager App with Firebase and REST API integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.0.0

  # HTTP
  http: ^1.2.1

  # UI
  intl: ^0.19.0
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
